<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — BreakAlley</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg: #0a0e1c; --card: #151c38; --line: #26305c; --text: #f2f4ff;
          --muted: #8b93b8; --green: #00e676; --red: #ff3b5c; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         color: var(--text); background: var(--bg); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .box { width: 100%; max-width: 400px; background: linear-gradient(180deg, #1a2242, #151c38);
         border: 1px solid var(--line); border-radius: 18px; padding: 2.2rem; }
  .mark { display: block; width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 1rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.45rem; font-weight: 900; text-align: center; }
  p.sub { color: var(--muted); font-size: .9rem; text-align: center; margin: 0 0 1.6rem; }
  label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin: 0 0 .35rem; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 3.4rem; }
  .pw-toggle { position: absolute; right: .6rem; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--muted); font-size: .78rem; font-weight: 700;
    cursor: pointer; font-family: inherit; }
  input[type=email], input[type=password], input[type=text] { width: 100%; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: .8rem 1rem; font-size: 1rem; margin-bottom: 1rem; font-family: inherit; }
  input:focus { border-color: var(--green); outline: none; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  button.submit { width: 100%; padding: .85rem; font-size: 1rem; font-weight: 800; color: #04120a;
    background: var(--green); border: 0; border-radius: 10px; cursor: pointer; font-family: inherit; }
  button.submit:hover { filter: brightness(1.08); }
  .err { background: rgba(255,59,92,.12); border: 1px solid var(--red); border-radius: 10px;
    padding: .7rem .9rem; font-size: .88rem; margin-bottom: 1rem; color: #ff8ba0; }
  .alt { text-align: center; margin-top: 1.2rem; font-size: .88rem; color: var(--muted); }
  .alt a { color: var(--green); font-weight: 700; }
  .home { display: block; text-align: center; margin-top: .8rem; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="box">
  <img class="mark" src="/static/logo-mark.webp" alt="BreakAlley">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your BreakAlley account</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@email.com">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      <button type="button" class="pw-toggle" onclick="var i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide';">Show</button>
    </div>
    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="submit" type="submit">Sign in</button>
  </form>
  <div class="alt">New here? <a href="/signup">Create a free account</a></div>
  <a class="home" href="/">← back to breaks</a>
</div>
{% include "_feedback.html" %}
</body>
</html>
