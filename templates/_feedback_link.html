{# Feedback link (Brian 2026-10-11) — replaces the inline feedback form that
   used to sit at the bottom of every page. Links to the standalone /feedback page. #}
<style>
  .fb-link { max-width: 640px; margin: 3rem auto 0; padding: 0 1.25rem 3rem; text-align: center;
    color: #8b93b8; font-size: .95rem; line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .fb-link a { color: #00e676; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .fb-link a:hover { text-decoration: underline; }
</style>
<p class="fb-link">Spotted a bug, missing a breaker, or have an idea?<br><a href="/feedback?next={{ request.url.path }}">Leave feedback →</a></p>
