# Break Alley — Render Blueprint.
# Deploy: push this repo to GitHub, connect it in Render, then
# "New +" -> "Blueprint" and point it at this file.
# After deploy, fill in the `sync: false` secret values in the
# Render dashboard (or via API). eBay keys pending approval (Tue 2026-10-06).

databases:
  - name: break-alley-db
    plan: starter

services:
  # ---- Web app (FastAPI) ----
  - type: web
    name: break-alley
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_CAMPID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false

  # ---- Pollers (cron jobs, $1/mo each) ----
  - type: cron
    name: break-alley-poll-ebay
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    dockerCommand: python -m app.ingest --source ebay
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false

  - type: cron
    name: break-alley-poll-youtube
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */6 * * *"
    dockerCommand: python -m app.ingest --source youtube
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false

  - type: cron
    name: break-alley-poll-twitch
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/20 * * * *"
    dockerCommand: python -m app.ingest --source twitch
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
