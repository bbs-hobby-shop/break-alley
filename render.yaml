# BreakAlley — Render Blueprint.
# Deploy: push this repo to GitHub, connect it in Render, then
# "New +" -> "Blueprint" and point it at this file.
# After deploy, fill in the `sync: false` secret values in the
# Render dashboard (or via API). eBay keys pending approval (Tue 2026-10-06).

databases:
  - name: break-alley-db
    plan: 0.1c-256mb # cheapest paid Postgres (~$6/mo); free tier risks data expiry

services:
  # ---- Web app (FastAPI) ----
  - type: web
    name: break-alley
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_CAMPID
        sync: false
      # YOUTUBE_API_KEY comes from the break-alley-shared environment group
      # (dashboard). Do NOT re-add it here as sync:false — an empty
      # service-level var would shadow the group value.
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  # ---- Pollers (cron jobs, $1/mo each) ----
  - type: cron
    name: break-alley-poll-ebay
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Brian 2026-10-09: slowed 15 -> 30 min to ease eBay 429 throttling
    schedule: "*/30 * * * *"
    dockerCommand: python -m app.ingest --source ebay
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false

  - type: cron
    name: break-alley-poll-youtube-roster
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */3 * * *"
    dockerCommand: python -m app.ingest --source youtube-roster
    # YOUTUBE_API_KEY comes from the break-alley-shared environment group
    # (dashboard). Do NOT re-add it here as sync:false.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      # Widen upload window 10->25 (Brian 2026-10-07 audit): scheduled breaks
      # were falling out of the 10-video window on high-volume channels.
      - key: YOUTUBE_ROSTER_VIDEOS_PER_CHANNEL
        value: "25"

  - type: cron
    name: break-alley-poll-twitch
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/20 * * * *"
    dockerCommand: python -m app.ingest --source twitch-roster
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false

  # ---- Fanatics Live roster poller (Brian 2026-10-07) ----
  # Public GraphQL API, no auth needed. Every 20 min like Twitch.
  - type: cron
    name: break-alley-poll-fanatics
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/20 * * * *"
    dockerCommand: python -m app.ingest --source fanatics
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString

  # ---- Daily system health check (Brian 2026-10-07) ----
  # 6 AM CDT (11 AM UTC): verifies pollers, data quality, site health,
  # link validity, prune working, security basics. Top-line standards.
  - type: cron
    name: break-alley-health-check
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 11 * * *"
    dockerCommand: python -m app.health_check
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString

  # ---- Release-night extra passes (Idea 2026-10-06, calendar 2026-10-07) ----
  # Runs daily at 01:00 UTC (8 PM CDT); the code reads release dates from the
  # release_calendar table (editable at /admin/releases) and no-ops on other
  # nights. On release nights it runs an extra YouTube roster pass
  # (~107 API units). Attach the break-alley-shared env group on the dashboard
  # for YOUTUBE_API_KEY (same as the roster cron).
  - type: cron
    name: break-alley-release-night
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 1 * * *"
    dockerCommand: python -m app.ingest --source release-night
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: break-alley-db
          property: connectionString
